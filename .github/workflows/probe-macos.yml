name: probe macos
# Temporary: which macOS runner labels this repository can use. Deleted once answered.
on: workflow_dispatch

jobs:
  probe:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15, macos-15-intel, macos-latest]
    steps:
      - name: What is this machine
        run: uname -m && sw_vers
